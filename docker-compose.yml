services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: afis-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: afis
      POSTGRES_USER: afis
      POSTGRES_PASSWORD: afis_password

    ports:
      - "5432:5432"

    volumes:
      - afis-postgres-data:/var/lib/postgresql/data

volumes:
  afis-postgres-data:
